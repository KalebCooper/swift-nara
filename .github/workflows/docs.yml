name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize publications without blocking main behind pull-request builds.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Local catalogs pass; hosted qualification and delivery remain pending.
    if: ${{ false }}
    name: Build DocC site
    runs-on: xcode-27
    # Provisional until this package has green runs on main.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # Compile dependencies normally, then document only this package's products.
      # A recursive docbuild also documents dependency modules, whose external links
      # are outside this site's catalog and dependency archives.
      - name: Build modules
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SwiftNARACatalogBulk \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -derivedDataPath .derivedData \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions

      - name: Build and package documentation
        run: bash Scripts/build-docs.sh .derivedData/Build/Products/Debug-iphonesimulator .docc-output

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .docc-output/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Publishing requires the package delivery decision and hosted qualification.
    if: ${{ false }}
    # Provisional until this package has green runs on main.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
