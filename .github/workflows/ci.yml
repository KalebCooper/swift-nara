name: CI

# Every build lane here is deliberate. The Linux container proves the package stays portable off Apple
# platforms (the whole point of keeping URLSession out of SwiftNARACatalogBulkModels and behind
# `#if canImport(Darwin)` in SwiftNARACatalogBulk) and is cheap. The Android emulator proves the same claim on
# Android, under the same trait, and is cheap too. The macOS lane is the real target and costs money:
# batch commits and push once, and verify locally before pushing rather than letting CI diagnose a
# failure.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    # Every job in this repository is bounded, so a hang fails the job instead of sitting for the
    # six-hour default. The ceiling is meant to be that job's slowest green run on `main` under its
    # current definition, rounded up to the next five minutes and then tripled. `Scripts/verify.sh`
    # holds the rule that every job has one.
    # Provisional ceiling until this package has green runs on main.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The trait set is part of the key: a `.build` made with a different trait set is the same
      # manifest and the same pins but not the same graph, and restoring one would hand this run a
      # stale build.
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-traits-HTTPPortable-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-traits-HTTPPortable-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-traits-HTTPPortable-
      # The trait is enabled here and on the Android lane only: this is the run that forwards it to
      # swifty-networking, builds the AsyncHTTPClient transport and the SwiftNIO stack beneath it, and
      # runs the suite against that graph.
      - name: Run tests
        run: swift test --traits HTTPPortable
      # The same suite again under the package's default trait set, which enables nothing, so what a
      # consumer who asks for no trait actually gets is compiled and run on every push: swifty-networking
      # resolved without its `HTTPPortable` trait and the SwiftNIO stack never fetched. It uses a
      # scratch path of its own so the cached `.build` above stays the graph its key names, and it runs
      # second so the cache restore serves the run that reuses it.
      - name: Run tests with the default trait set
        run: swift test --scratch-path .build-default

  android:
    name: swift test (Android)
    # `ubuntu-24.04` rather than `ubuntu-latest`: the action below derives the swift.org host toolchain
    # URL from the runner's os-release id, and swift.org publishes no build for a newer Ubuntu, so a
    # runner-image bump would fail the download before anything was compiled.
    runs-on: ubuntu-24.04
    # The action bounds only the emulator boot, so a hung adb run is otherwise unbounded here.
    # Provisional ceiling until this package has green runs on main.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The trait set is part of the key for the same reason it is on the Linux lane, and the
      # toolchain build is in the key because this file pins it: a bump below must not restore a
      # `.build` the old compiler wrote. `runner.os` is `Linux` here as well, so the platform is
      # spelled out or this lane would restore the Linux lane's graph. The cache restores before the
      # build and saves when the job ends. Keep the token here in step with `swift-version` below.
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-Android-swift-6.3.3-traits-HTTPPortable-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-Android-swift-6.3.3-traits-HTTPPortable-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-Android-swift-6.3.3-traits-HTTPPortable-
      # One composite step does the whole lane: it installs the swift.org host toolchain and the Swift
      # SDK for Android, pinned by exact build to the same 6.3.3 the Linux container runs, prints
      # `swift --version` straight after the install, builds the package and its tests for the x86_64
      # emulator triple, pushes the test runner to an emulator, and runs the whole suite there,
      # unfiltered. Pinned by commit, the same commit swifty-networking pins; the `actions/cache` and
      # `android-emulator-runner` it calls inside are the composite's own and cannot be pinned from
      # here. The trait is on, matching the Linux lane's first run: this is the lane that proves the
      # SDK dependencies compile with the AsyncHTTPClient transport on Android, and that the test resources
      # bundled with the test support target load there. `Module+URLSession.swift` compiles out
      # under `#if canImport(Darwin)`. Cold-boot the cached AVD because snapshots can retain
      # `sys.boot_completed=1` while Android services are not ready after a runner-image update.
      - name: Build and test on an Android emulator
        uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8 # v2.9.5
        with:
          android-emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim
          swift-build-flags: --traits HTTPPortable
          swift-version: '6.3.3'

  apple:
    name: Build & Test (iOS ${{ matrix.os }} Simulator)
    # Apple qualification uses Xcode 27 on the xcode-27 image.
    # The iOS runtime pin is independent of the package deployment target.
    strategy:
      matrix:
        include:
          - device: iPhone 18 Pro
            os: '27.0'
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    # Provisional ceiling until measured green runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      # Surfaces the runner's real device names so a runner-image bump that renames a simulator is
      # diagnosable from the log, not just a red X.
      - name: List available simulators
        run: xcrun simctl list devices available
      # Pin iOS 27.0 explicitly; inspect the listed simulators before changing the pin.
      # This lane compiles the Darwin URLSession path, unlike Linux and Android.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme swift-nara-Package \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.os }}' \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions

      # The command-line example reads recorded fixtures without contacting the provider.
      - name: Build demo for release
        run: |
          swift run -c release --package-path Examples/SwiftNARACatalogBulkDemo \
            SwiftNARACatalogBulkDemo "$PWD/Sources/SwiftNARACatalogBulkTestSupport/Fixtures"

  lint:
    name: swift-format lint
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    # Provisional ceiling until this package has green runs on main.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Show swift-format version
        run: swift format --version
      # Any finding fails the job.
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Examples/SwiftNARACatalogBulkDemo/Sources

  source:
    name: Validate source conventions
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    # Provisional until this package has green runs on main.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install validation runtime
        run: apt-get update && apt-get install -y python3
      - name: Validate source
        run: bash Scripts/verify.sh
      - name: Validate gate self-tests
        run: bash Scripts/verify.sh --self-test
